<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<title>Leaf Control — просто</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#22262b;--muted:#6f7780;--line:#e3e6ea;--accent:#0077ac;--ok:#34c759;--warn:#ff9500;--err:#ff3b30}
@media (prefers-color-scheme: dark){:root{--bg:#0b0e11;--card:#161a1f;--text:#e8ecf1;--muted:#8f99a3;--line:#252b33;--accent:#4aa8d8}}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  padding:12px;display:flex;flex-direction:column;gap:10px;max-width:520px;margin:0 auto;min-height:100vh}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
header b{font-size:15px;letter-spacing:.3px}
header span{font-size:11px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.charge{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.charge .pct{display:flex;align-items:baseline;gap:4px}
.charge .pct b{font-size:54px;font-weight:600;line-height:1}
.charge .pct small{font-size:16px;color:var(--muted)}
.charge .km{text-align:right}
.charge .km b{font-size:24px;font-weight:600;line-height:1}
.charge .km span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid div{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.grid b{display:block;font-size:16px;font-weight:600}
.grid span{font-size:11px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;
  padding:14px 8px;font:inherit;font-size:14px;cursor:pointer;position:relative;overflow:hidden;
  transition:background .15s,border-color .15s,transform .1s;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){button.on{color:#08121a;font-weight:600}}
button.holding{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(.97)}
button:disabled{opacity:.45}
.hint{font-size:11.5px;color:var(--muted);line-height:1.5;text-align:center}
.err{font-size:12px;text-align:center;min-height:16px;color:var(--muted)}
.err.bad{color:var(--err)}
.err.good{color:var(--ok)}
.full{display:block;width:100%;text-align:center;padding:12px;border:1px solid var(--accent);color:var(--accent);
  background:transparent;border-radius:11px;text-decoration:none;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<header>
  <b>Leaf Control</b>
  <span id="upd">подключение…</span>
</header>

<div class="card">
  <div class="charge">
    <div class="pct"><b id="soc">—</b><small>%</small></div>
    <div class="km"><b id="range">—</b><span>км запаса</span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
</div>

<div class="grid">
  <div><b id="vi">—</b><span>напряжение / ток</span></div>
  <div><b id="power">—</b><span>мощность, кВт</span></div>
  <div><b id="btemp">—</b><span>батарея, °C</span></div>
  <div><b id="cabin">—</b><span>салон, °C</span></div>
  <div style="grid-column:1 / -1"><b id="state">—</b><span>состояние</span></div>
</div>

<div class="row">
  <button id="b-hvac" data-act="hvac">Климат</button>
  <button id="b-charge" data-act="charge">Зарядить</button>
  <button id="b-lights" data-act="lights">Свет</button>
  <button id="b-horn" data-act="horn">Свет + сигнал</button>
  <button id="b-lock" data-act="lock">Закрыть</button>
  <button id="b-refresh">Обновить</button>
</div>

<div class="err" id="msg">команды выполняются удержанием кнопки</div>
<form method="POST" action="/ui" style="margin:0">
  <input type="hidden" name="mode" value="full">
  <button class="full" type="submit">Красивый вид</button>
</form>
<p class="hint">Упрощённая страница: цифры и основные команды, открывается мгновенно даже при слабом сигнале.</p>

<script>
'use strict';
var S = {}, busy = false, cmdBusy = false, holdTimer = null, holdBtn = null;

function fmt(v, digits){ return (v === null || v === undefined || v < 0) ? '—' : v.toFixed(digits === undefined ? 1 : digits); }

function msg(text, kind){
  var el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'err' + (kind ? ' ' + kind : '');
}

function render(){
  document.getElementById('soc').textContent = S.soc >= 0 ? Math.round(S.soc) : '—';
  var range = S.irange >= 0 ? S.irange : (S.soc >= 0 ? Math.round(S.soc * 2.5) : '—');
  document.getElementById('range').textContent = range;
  document.getElementById('bar').style.width = (S.soc >= 0 ? Math.max(0, Math.min(100, S.soc)) : 0) + '%';
  document.getElementById('vi').textContent = fmt(S.v) + ' В · ' + fmt(S.i) + ' А';
  document.getElementById('power').textContent = fmt(S.power);
  document.getElementById('btemp').textContent = fmt(S.btemp);
  document.getElementById('cabin').textContent = fmt(S.cabin);
  document.getElementById('state').textContent = S.charging ? 'зарядка' : (S.hvac ? 'климат включён' : (S.on ? 'включён' : 'покой'));
  var hv = document.getElementById('b-hvac');
  hv.textContent = S.hvac ? 'Выкл климат' : 'Климат';
  hv.classList.toggle('on', !!S.hvac);
  var ch = document.getElementById('b-charge');
  ch.textContent = S.charging ? 'Идёт зарядка' : 'Зарядить';
  ch.classList.toggle('on', !!S.charging);
  ch.disabled = !!S.charging || cmdBusy;
  var lk = document.getElementById('b-lock');
  lk.textContent = S.lock === 0 ? 'Открыто' : 'Закрыть';
  lk.classList.toggle('on', S.lock === 0);
}

function stamp(){
  if(!S._at) return;
  var sec = Math.round((Date.now() - S._at) / 1000);
  document.getElementById('upd').textContent = sec < 6 ? 'данные свежие' : ('обновлено ' + sec + ' с назад');
}

function poll(manual){
  if(busy) return;
  busy = true;
  fetch('/api/status', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
    S = j; S._at = Date.now();
    render(); stamp();
    if(manual) document.getElementById('upd').textContent = 'обновлено сейчас';
  }).catch(function(){
    document.getElementById('upd').textContent = 'нет связи с платой';
  }).then(function(){ busy = false; });
}

function urlFor(what){
  if(what === 'hvac') return S.hvac ? '/hvac_off' : '/hvac_on?setpoint=22&minutes=15';
  if(what === 'charge') return '/charge_on';
  if(what === 'lights') return '/lights';
  if(what === 'horn') return '/hornlights';
  return (S.lock === 0) ? '/lock' : '/unlock';
}

function run(what){
  if(cmdBusy) { msg('плата занята — дождитесь окончания', 'bad'); return; }
  cmdBusy = true;
  var long = (what === 'lights' || what === 'horn');
  msg(long ? 'выполняется — около 8 секунд' : 'команда отправлена…');
  render();
  fetch(urlFor(what), {method:'POST', cache:'no-store'}).then(function(r){
    if(r.status === 409){ msg('плата занята предыдущей командой', 'bad'); return; }
    if(r.status === 400){ msg('команда отклонена платой', 'bad'); return; }
    if(!r.ok && r.status !== 303 && r.status !== 200){ msg('ошибка ' + r.status, 'bad'); return; }
    msg(long ? 'выполняется — около 8 секунд' : 'выполнено', 'good');
    setTimeout(function(){ poll(true); }, long ? 9000 : 1500);
  }).catch(function(){
    msg('команда не отправлена', 'bad');
  }).then(function(){
    setTimeout(function(){ cmdBusy = false; render(); }, long ? 9000 : 1500);
  });
}

// Commands need a short hold: it protects from an accidental touch in a pocket.
function attachHold(btn){
  var act = btn.dataset.act;
  if(!act) return;
  function start(e){
    if(btn.disabled || cmdBusy) return;
    e.preventDefault();
    holdBtn = btn; btn.classList.add('holding');
    holdTimer = setTimeout(function(){
      holdTimer = null; holdBtn = null; btn.classList.remove('holding');
      if(navigator.vibrate) try { navigator.vibrate(30); } catch(err) {}
      run(act);
    }, 600);
  }
  function cancel(){
    if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
    if(holdBtn){ holdBtn.classList.remove('holding'); holdBtn = null; }
  }
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', cancel);
  btn.addEventListener('pointerleave', cancel);
  btn.addEventListener('pointercancel', cancel);
  btn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

document.querySelectorAll('button[data-act]').forEach(attachHold);
document.getElementById('b-refresh').addEventListener('click', function(){ poll(true); });

poll();
setInterval(function(){ poll(); }, 4000);
setInterval(stamp, 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) poll(); });
</script>
</body>
</html>
