<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000" media="(prefers-color-scheme: dark)">
<title>Leaf Control — вход</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
:root{--bg:#f2f2f7;--surface:#fff;--text:#1c1c1e;--muted:#8e8e93;--line:#e5e5ea;--accent:#40a0da;--danger:#ff3b30}
@media (prefers-color-scheme:dark){:root{--bg:#000;--surface:#1c1c1e;--text:#fff;--muted:#8e8e93;--line:#38383a;--accent:#40a0da;--danger:#ff453a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
 font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 display:flex;align-items:center;justify-content:center;padding:20px}
.form{width:100%;max-width:380px}
h1{font-size:24px;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
 background:var(--surface);color:var(--text);font-size:16px;margin-bottom:12px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);
 color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:disabled{opacity:.45}
.hint{font-size:13px;color:var(--danger);min-height:18px;margin-bottom:6px}
</style>
</head>
<body>
  <form class="form" id="f">
    <h1>Leaf Control</h1>
    <div class="sub">Сервер управления автомобилем</div>
    <label>Логин</label>
    <input id="u" autocomplete="username" autocapitalize="off" placeholder="admin или логин с платы">
    <label>Пароль</label>
    <input id="p" type="password" autocomplete="current-password">
    <div class="hint" id="hint"></div>
    <button type="submit" id="b">Войти</button>
    <div style="margin-top:14px;text-align:center">
      <a href="#" id="toReg" style="color:var(--accent);font-size:14px;text-decoration:none">Нет аккаунта? Зарегистрироваться</a>
    </div>
  </form>

  <form class="form" id="regForm" style="display:none">
    <h1>Leaf Control</h1>
    <div class="sub">Создайте аккаунт — машины добавите кодом с платы</div>
    <label>Логин</label>
    <input id="ru" autocomplete="username" autocapitalize="off" placeholder="латиница, цифры, 3–32 символа">
    <label>Пароль</label>
    <input id="rp" type="password" autocomplete="new-password" placeholder="минимум 8 символов">
    <label>Пароль ещё раз</label>
    <input id="rp2" type="password" autocomplete="new-password">
    <div class="hint" id="rhint"></div>
    <button type="submit" id="rb">Создать аккаунт</button>
    <div style="margin-top:14px;text-align:center">
      <a href="#" id="toLogin" style="color:var(--accent);font-size:14px;text-decoration:none">Уже есть аккаунт — войти</a>
    </div>
  </form>
<script>
const $ = (id) => document.getElementById(id);
function hint(t) { $('hint').textContent = t || ''; }
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  hint('');
  $('b').disabled = true;
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('u').value.trim(), password: $('p').value })
    });
    let j = null; try { j = await r.json(); } catch {}
    if (!r.ok) throw new Error((j && j.error) || 'Не удалось войти');
    location.href = '/';
  } catch (err) {
    hint(err.message);
    $('b').disabled = false;
  }
});

const f = document.getElementById('f');
const rf = document.getElementById('regForm');
document.getElementById('toReg').onclick = (e) => {
  e.preventDefault(); f.style.display = 'none'; rf.style.display = 'block'; rf.style.maxWidth = '380px';
};
document.getElementById('toLogin').onclick = (e) => {
  e.preventDefault(); rf.style.display = 'none'; f.style.display = 'block';
};
rf.addEventListener('submit', async (e) => {
  e.preventDefault();
  const h = document.getElementById('rhint');
  h.textContent = '';
  if (document.getElementById('rp').value !== document.getElementById('rp2').value) {
    h.textContent = 'Пароли не совпадают'; return;
  }
  document.getElementById('rb').disabled = true;
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('ru').value.trim(),
        password: document.getElementById('rp').value
      })
    });
    let j = null; try { j = await r.json(); } catch {}
    if (!r.ok) throw new Error((j && j.error) || 'Не удалось создать аккаунт');
    location.href = '/';
  } catch (err) {
    h.textContent = err.message;
    document.getElementById('rb').disabled = false;
  }
});
</script>
</body>
</html>
