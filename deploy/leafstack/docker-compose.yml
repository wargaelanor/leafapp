# LeafControl — серверный стек (Traccar + InfluxDB 2 + Grafana + Portainer)
#
# Быстрый старт:
#   cp .env.example .env     # заполнить пароли/токен
#   docker compose up -d
#
# Адреса после запуска:
#   http://<host>:8925  Traccar   (карта, поездки, API приёма позиций)
#   http://<host>:3000  Grafana   (готовый дашборд LeafControl)
#   http://<host>:8086  InfluxDB  (API хранилища)
#   https://<host>:9443 Portainer (только с профилем admin)
#
# Профили (не запускаются по умолчанию):
#   --profile admin   Portainer — управление контейнерами из браузера
#   --profile remote  Tailscale — доступ из интернета без проброса портов

name: ${STACK_NAME:-leafstack}

services:
  influxdb:
    image: influxdb:2.7
    container_name: leafstack-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:-leafadmin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?set INFLUX_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-leaf}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_RETENTION: 0
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    ports:
      - "${INFLUX_PORT:-8086}:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: leafstack-grafana
    restart: unless-stopped
    depends_on:
      - influxdb
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-leafview}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      # токен подставляется в provisioned datasource
      INFLUX_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  traccar:
    image: traccar/traccar:latest
    container_name: leafstack-traccar
    restart: unless-stopped
    environment:
      JAVA_EXTRA_OPTIONS: -Xmx320m
    volumes:
      - traccar-data:/opt/traccar/data
      - ./traccar/conf.xml:/opt/traccar/conf/traccar.xml:ro
    ports:
      - "${TRACCAR_PORT:-8925}:8082"

  portainer:
    profiles: ["admin"]
    image: portainer/portainer-ce:latest
    container_name: leafstack-portainer
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    ports:
      - "${PORTAINER_PORT:-9443}:9443"

  # Удалённый доступ без проброса портов и без белого IP.
  # Включается: docker compose --profile remote up -d
  # Требуется TS_AUTHKEY в .env (ключ из https://login.tailscale.com/admin/settings/keys)
  # После запуска стек доступен по tailnet-адресу машины: http://<hostname>:3000 и т.д.
  tailscale:
    profiles: ["remote"]
    image: tailscale/tailscale:latest
    container_name: leafstack-tailscale
    restart: unless-stopped
    network_mode: host
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env, or start without --profile remote}
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: ${TS_HOSTNAME:-leafstack}
      TS_USERSPACE: ${TS_USERSPACE:-false}
      TS_AUTO_UPDATE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

volumes:
  influx-data:
  influx-config:
  grafana-data:
  traccar-data:
  portainer-data:
  tailscale-state:
